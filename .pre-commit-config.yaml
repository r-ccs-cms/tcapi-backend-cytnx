# pre-commit builds a Python hook's environment with the Python pre-commit
# runs on, and shellcheck-py v0.11.0.1 needs Python 3.9 or later, as pre-commit
# does from 3.6.0. An older pre-commit rejects this file before it builds any
# hook's environment.
minimum_pre_commit_version: "3.6.0"
# `pre-commit install` installs these hook types; git runs pre-merge-commit,
# not pre-commit, when `git merge` makes the merge commit itself. A hook that
# declares no stage runs at every stage in default_stages, which lists all of
# pre-commit's stages except pre-push, so that only the clang-tidy check runs
# at push.
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages:
  - commit-msg
  - post-checkout
  - post-commit
  - post-merge
  - post-rewrite
  - pre-commit
  - pre-merge-commit
  - pre-rebase
  - prepare-commit-msg
  - manual

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      # Formats shell scripts with -i 2 -ci -bn, the flags shfmt's manual
      # gives as closely resembling Google's shell style guide, since
      # .clang-format bases C++ formatting on Google's style. The hook
      # declares its own stages, pre-push among them, so this lists them
      # without pre-push.
      - id: shfmt
        args: [--write, -i, "2", -ci, -bn]
        stages: [pre-commit, pre-merge-commit, manual]
  - repo: local
    hooks:
      # Compares clang-tidy's results with .clang-tidy-baseline. It runs on
      # every push that adds commits, whatever files they touch, and analyzes
      # every source, since changes outside the sources, such as to
      # CMakeLists.txt or the script, can change the results too.
      # pre-commit runs no pre-push hook for a branch deletion, or for a new
      # branch whose commits are all on the remote already.
      - id: clang-tidy-baseline
        name: clang-tidy baseline
        entry: scripts/tidy-count.sh --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Runs include-what-you-use on every header under include/tcapi/. It runs
      # whatever files the commit changes: pre-commit passes a hook no deleted
      # file, nor, under the default types, a submodule, and a change outside
      # the headers, such as to CMakeLists.txt or Cytnx, can change the results.
      - id: iwyu
        name: include-what-you-use
        entry: scripts/iwyu-check.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit, manual]
